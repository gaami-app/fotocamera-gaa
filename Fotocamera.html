<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Fotocamera GAA</title>
<!--
  ==========================================================
  SEGNALAZIONI GAA — Fotocamera.html (pagina esterna, GitHub Pages)
  ==========================================================
  Vive fuori da Apps Script: qui getUserMedia/geolocalizzazione
  funzionano (non c'è l'iframe-sandbox di Apps Script che li blocca).

  Parametri attesi nell'URL:
    ?token=...&sessione=...&ritorno=<url già pronto con ?fotoSessione=...>

  Comunica col backend Apps Script SOLO via HTTP POST (doPost in
  Configurazione.gs), mai google.script.run (non è una pagina servita
  da lì). Ogni chiamata: Content-Type text/plain (mai application/json,
  altrimenti il browser fa un preflight che Apps Script non gestisce).

  Flusso:
  1) Legge parametri URL.
  2) Chiede il permesso di posizione. Se negato -> pannello istruzioni
     (per dispositivo rilevato) + "Riprova" + "Continua senza posizione".
  3) Se posizione ottenuta: chiama indirizzoDaCoordinate con timeout di
     10s. Scaduto il timeout (o errore), si prosegue comunque con le
     sole coordinate grezze al posto dell'indirizzo in chiaro.
  4) Avvia il video (getUserMedia, fotocamera posteriore). Il pulsante
     di scatto resta disabilitato finché il video non ha davvero un
     fotogramma valido (videoWidth/videoHeight > 0) — su alcuni browser
     (Samsung Internet incluso) il flusso può restare "congelato" sul
     primissimo istante se ci si affida solo ad autoplay/onloadedmetadata.
  5) Zoom digitale (pizzico a due dita sul video, o pulsanti +/-): scala
     visivamente il video (CSS transform) e, allo scatto, ritaglia dal
     fotogramma reale solo la porzione centrale corrispondente allo zoom
     applicato — non è zoom ottico, è un ritaglio+ingrandimento software,
     universale su qualsiasi dispositivo/browser. Torna sempre a 1x
     quando si cambia tipo di overlay (Targa/Scudetto/Campo largo);
     resta invariato se si scattano più foto di fila con lo stesso tipo.
  6) L'operatore sceglie un overlay guida (Targa/Scudetto post./Campo
     largo/Scudetto ant.) e scatta: il fotogramma (ritagliato secondo lo
     zoom) va su un canvas, ci si disegna sopra la banda (3 righe), si
     scrivono le coordinate GPS (e l'indirizzo se disponibile) nell'EXIF
     (piexif.js), poi la foto viene caricata subito sul backend
     (cartella temporanea).
  7) Ogni foto occupa uno slot fisso per tipo (Targa=1, Scudetto
     post.=2, Campo largo=3/4, Scudetto ant.=5); se lo slot di casa è
     occupato, si cerca il primo libero partendo dal 5 e scendendo.
  8) Schermata di revisione: griglia degli slot, X per rimuovere (solo
     lato client — il file resta nella cartella temporanea, ripulito dal
     trigger automatico entro 24h se non viene mai salvato).
  9) "Conferma e torna al modulo": redirect all'URL "ritorno" (che
     contiene già ?fotoSessione=... per il recupero lato InviaSegnalazione).

  Semplificazione nota: la rimozione di una foto in fase di revisione è
  solo locale (lo slot torna libero per un nuovo scatto), il file già
  caricato non viene cancellato subito dal server — non è un problema:
  se la sessione non viene mai salvata, la pulizia automatica giornaliera
  se ne occupa comunque entro 24 ore.
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/piexifjs/1.0.6/piexif.js"></script>
<style>
  :root {
    --colore-sfondo: #EEF0EE;
    --colore-superficie: #FFFFFF;
    --colore-inchiostro: #16222C;
    --colore-inchiostro-tenue: #57666F;
    --colore-bordo: #DBDFDC;
    --colore-accento: #C17817;
    --colore-pericolo: #B4232F;
    --colore-pericolo-tenue: #FBEAEA;
    --raggio: 14px;
    --raggio-piccolo: 9px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    font-family: -apple-system, 'Inter', Arial, sans-serif; background: #000; color: #fff;
  }
  button { font-family: inherit; cursor: pointer; border: none; }

  /* ---------- SCHERMO 1: FOTOCAMERA ---------- */
  #schermoCamera { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; }
  .area-video { position: relative; flex: 1; overflow: hidden; background: #000; touch-action: none; }
  #video { width: 100%; height: 100%; object-fit: cover; display: block; transform-origin: center center; }
  #canvasScatto { display: none; }

  .barra-top {
    position: absolute; top: 0; left: 0; right: 0; z-index: 5;
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px 14px;
    background: linear-gradient(rgba(0,0,0,0.55), transparent);
  }
  .btn-tondo {
    width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,0.15);
    color: #fff; display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .contatore-foto { color: #D4AF37; font-size: 13px; font-weight: 600; }
  .switch-overlay { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #ccc; }
  .switch-overlay input { width: 30px; height: 16px; }

  .guida-overlay {
    position: absolute; border: 2px dashed #D4AF37; pointer-events: none; z-index: 3;
    top: 50%; left: 50%; transform: translate(-50%, -50%); border-radius: 8px;
  }
  .guida-overlay.tondo { border-radius: 50%; }
  .etichetta-guida {
    position: absolute; top: 8%; left: 0; right: 0; text-align: center; z-index: 3;
    color: #D4AF37; font-size: 13px; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }

  .banda-anteprima {
    position: absolute; bottom: 10%; right: 4%; z-index: 3; background: rgba(0,0,0,0.55);
    color: #fff; font-size: 11px; padding: 6px 8px; border-radius: 4px; text-align: right;
    max-width: 60%; line-height: 1.4;
  }

  /* ---------- CONTROLLO ZOOM ---------- */
  .controllo-zoom {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%); z-index: 4;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .btn-zoom {
    width: 38px; height: 38px; border-radius: 50%; background: rgba(20,20,20,0.6);
    border: 1px solid rgba(255,255,255,0.25); color: #fff; font-size: 19px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; padding: 0; line-height: 1;
  }
  .btn-zoom:active { background: rgba(212,175,55,0.5); }
  .zoom-valore {
    background: rgba(20,20,20,0.6); color: #D4AF37; font-size: 11px; font-weight: 700;
    padding: 3px 6px; border-radius: 10px; min-width: 34px; text-align: center;
  }

  .striscia-slot { display: flex; gap: 6px; padding: 8px 12px; background: #000; z-index: 5; overflow-x: auto; }
  .slot {
    width: 40px; height: 40px; border-radius: 6px; flex-shrink: 0; overflow: hidden; position: relative;
    background: #1e1e1e; border: 1px dashed #444; display: flex; align-items: center; justify-content: center;
  }
  .slot img { width: 100%; height: 100%; object-fit: cover; }
  .slot.pieno { border: 1px solid #D4AF37; }
  .slot span { font-size: 8px; color: #888; text-align: center; line-height: 1.15; padding: 2px; }

  .selettore-overlay { display: flex; justify-content: center; gap: 14px; padding: 8px 4px 4px; background: #000; z-index: 5; }
  .icona-overlay { display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; padding: 0; }
  .icona-overlay .cerchio {
    width: 38px; height: 38px; border-radius: 50%; background: #1e1e1e; border: 1px solid #444;
    display: flex; align-items: center; justify-content: center; color: #8a8a8a; font-size: 16px;
  }
  .icona-overlay.attivo .cerchio { background: #D4AF37; border-color: #D4AF37; color: #0a0a0a; }
  .icona-overlay span.etichetta { color: #8a8a8a; font-size: 9px; text-align: center; line-height: 1.2; }
  .icona-overlay.attivo span.etichetta { color: #D4AF37; font-weight: 600; }

  .barra-scatto {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 24px calc(16px + env(safe-area-inset-bottom, 0px)) 24px; background: #000; z-index: 5;
  }
  .btn-scatta {
    width: 64px; height: 64px; border-radius: 50%; background: #D4AF37; border: 4px solid #3a3a3a;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .btn-scatta:disabled { opacity: 0.4; }
  .btn-scatta .interno { width: 50px; height: 50px; border-radius: 50%; background: #D4AF37; border: 2px solid #000; }
  .btn-testo {
    width: 34px; height: 34px; border-radius: 6px; background: #D4AF37; color: #0a0a0a;
    font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center;
  }
  .segnaposto { width: 34px; height: 34px; }

  /* ---------- SCHERMO 2: PERMESSO NEGATO / REVISIONE (stile chiaro, come il resto dell'app) ---------- */
  .schermo-chiaro {
    position: fixed; inset: 0; background: var(--colore-sfondo); color: var(--colore-inchiostro);
    display: none; flex-direction: column; padding: 20px 16px; overflow-y: auto;
  }
  .scheda-chiara {
    background: var(--colore-superficie); border: 1px solid var(--colore-bordo); border-radius: var(--raggio);
    padding: 24px 20px; max-width: 460px; margin: 0 auto; width: 100%;
  }
  .scheda-chiara h2 { font-size: 18px; margin: 0 0 8px; text-align: center; }
  .scheda-chiara p.sotto { text-align: center; font-size: 13.5px; color: var(--colore-inchiostro-tenue); margin: 0 0 20px; line-height: 1.5; }
  .icona-avviso { text-align: center; font-size: 34px; margin-bottom: 14px; }
  .blocco-istruzioni {
    background: var(--colore-sfondo); border-radius: 6px; padding: 14px 16px; margin-bottom: 16px;
  }
  .blocco-istruzioni p.titolo { font-size: 13px; font-weight: 600; margin: 0 0 8px; }
  .blocco-istruzioni ol { font-size: 13px; margin: 0; padding-left: 18px; line-height: 1.7; color: #333; }
  button.btn-largo {
    width: 100%; padding: 12px; border-radius: var(--raggio-piccolo); font-size: 14px; font-weight: 700; margin-bottom: 10px;
  }
  .btn-scuro { background: var(--colore-inchiostro); color: #fff; }
  .btn-outline { background: #fff; color: var(--colore-inchiostro-tenue); border: 1px solid var(--colore-bordo); }
  .btn-ambra { background: var(--colore-accento); color: #fff; }

  .griglia-revisione { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
  .cella-revisione {
    position: relative; aspect-ratio: 1; border-radius: 6px; overflow: hidden; background: #2c2c2c;
    display: flex; align-items: center; justify-content: center;
  }
  .cella-revisione img { width: 100%; height: 100%; object-fit: cover; }
  .cella-revisione.vuota { background: none; border: 1px dashed var(--colore-bordo); }
  .cella-revisione .etichetta-tipo {
    position: absolute; bottom: 3px; left: 3px; right: 3px; background: rgba(0,0,0,0.6); color: #fff;
    font-size: 9px; text-align: center; padding: 1px 2px; border-radius: 3px;
  }
  .cella-revisione.vuota .etichetta-tipo { position: static; background: none; color: #999; }
  .btn-rimuovi-cella {
    position: absolute; top: 3px; right: 3px; width: 18px; height: 18px; border-radius: 50%;
    background: #fff; border: 1px solid var(--colore-bordo); color: var(--colore-pericolo);
    display: flex; align-items: center; justify-content: center; font-size: 11px; padding: 0;
  }
  .riga-bottoni-revisione { display: flex; gap: 10px; }
  .riga-bottoni-revisione button { flex: 1; margin: 0; }

  /* ---------- OVERLAY CARICAMENTO GENERICO ---------- */
  #overlayAttesa {
    display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.75);
    color: #fff; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  }
  .spinner { width: 36px; height: 36px; border: 4px solid rgba(255,255,255,0.25); border-top-color: #fff; border-radius: 50%; animation: girare 0.8s linear infinite; }
  @keyframes girare { to { transform: rotate(360deg); } }

  #toast {
    position: fixed; top: -80px; left: 14px; right: 14px; z-index: 110; background: var(--colore-pericolo-tenue);
    color: var(--colore-pericolo); padding: 12px 14px; border-radius: var(--raggio-piccolo); font-size: 13px;
    font-weight: 600; text-align: center; transition: top 0.25s ease; max-width: 460px; margin: 0 auto;
  }
  #toast.visibile { top: 14px; }
</style>
</head>
<body>

  <!-- ================= SCHERMO CAMERA ================= -->
  <div id="schermoCamera">
    <div class="area-video" id="areaVideo">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvasScatto"></canvas>

      <div class="barra-top">
        <button class="btn-tondo" onclick="chiudiSenzaSalvare_()">✕</button>
        <span class="contatore-foto" id="contatoreFoto">0 di 5</span>
        <label class="switch-overlay">
          Overlay
          <input type="checkbox" id="toggleOverlay" checked onchange="aggiornaGuidaVisibile_()">
        </label>
      </div>

      <div class="etichetta-guida" id="etichettaGuida"></div>
      <div class="guida-overlay" id="guidaOverlay"></div>
      <div class="banda-anteprima" id="bandaAnteprima" style="display:none;"></div>

      <div class="controllo-zoom">
        <button type="button" class="btn-zoom" onclick="modificaZoom_(0.5)">+</button>
        <span class="zoom-valore" id="zoomValore">1.0x</span>
        <button type="button" class="btn-zoom" onclick="modificaZoom_(-0.5)">−</button>
      </div>
    </div>

    <div class="striscia-slot" id="strisciaSlot"></div>

    <div class="selettore-overlay">
      <button type="button" class="icona-overlay attivo" data-tipo="targa" onclick="selezionaOverlay_('targa')">
        <span class="cerchio">▭</span><span class="etichetta">Targa</span>
      </button>
      <button type="button" class="icona-overlay" data-tipo="scudettoPost" onclick="selezionaOverlay_('scudettoPost')">
        <span class="cerchio">▯</span><span class="etichetta">Scudetto<br>post.</span>
      </button>
      <button type="button" class="icona-overlay" data-tipo="campoLargo" onclick="selezionaOverlay_('campoLargo')">
        <span class="cerchio">▢</span><span class="etichetta">Campo largo</span>
      </button>
      <button type="button" class="icona-overlay" data-tipo="scudettoAnt" onclick="selezionaOverlay_('scudettoAnt')">
        <span class="cerchio">◯</span><span class="etichetta">Scudetto<br>ant.</span>
      </button>
    </div>

    <div class="barra-scatto">
      <div class="segnaposto"></div>
      <button type="button" class="btn-scatta" id="bottoneScatta" onclick="scattaFoto_()" disabled>
        <div class="interno"></div>
      </button>
      <button type="button" class="btn-testo" onclick="vaiARevisione_()">Fine</button>
    </div>
  </div>

  <!-- ================= SCHERMO PERMESSO NEGATO ================= -->
  <div class="schermo-chiaro" id="schermoPermesso">
    <div class="scheda-chiara">
      <div class="icona-avviso">📍</div>
      <h2>Posizione non disponibile</h2>
      <p class="sotto">Per scattare le foto serve il permesso di localizzazione. Segui i passaggi per il tuo dispositivo.</p>
      <div class="blocco-istruzioni" id="blocIstruzioni"></div>
      <button type="button" class="btn-largo btn-scuro" onclick="richiediPosizione_()">Riprova</button>
      <button type="button" class="btn-largo btn-outline" onclick="continuaSenzaPosizione_()">Continua senza posizione</button>
    </div>
  </div>

  <!-- ================= SCHERMO REVISIONE ================= -->
  <div class="schermo-chiaro" id="schermoRevisione">
    <div class="scheda-chiara">
      <h2 style="text-align:left;">Rivedi le foto</h2>
      <p class="sotto" style="text-align:left;" id="testoContatoreRevisione"></p>
      <div class="griglia-revisione" id="grigliaRevisione"></div>
      <div class="riga-bottoni-revisione">
        <button type="button" class="btn-outline" onclick="tornaAlMirino_()">Aggiungi foto</button>
        <button type="button" class="btn-ambra" onclick="confermaEInvia_()">Conferma e torna al modulo</button>
      </div>
    </div>
  </div>

  <div id="overlayAttesa">
    <div class="spinner"></div>
    <div id="testoAttesa">Attendere...</div>
  </div>
  <div id="toast"></div>

<script>
  // ---------------- PARAMETRI URL ----------------
  var parametri = new URLSearchParams(window.location.search);
  var TOKEN_ = parametri.get('token');
  var ID_SESSIONE_ = parametri.get('sessione');
  var URL_RITORNO_ = parametri.get('ritorno') ? decodeURIComponent(parametri.get('ritorno')) : null;

  var URL_APPS_SCRIPT_ = 'https://script.google.com/macros/s/AKfycbwB9tScCHU024o0Mkwnjp7Eb33irZop7vdbKn67nRMJm2AkkP5TDQwXpjOOxrzt8Xx2/exec';

  if (!TOKEN_ || !ID_SESSIONE_ || !URL_RITORNO_) {
    document.body.innerHTML = '<div style="padding:40px 20px; color:#fff; text-align:center; font-family:sans-serif;">Link non valido: apri la fotocamera dal pulsante "Scatta Foto" nell\'app.</div>';
    throw new Error('Parametri mancanti');
  }

  // ---------------- CHIAMATE AL BACKEND (doPost) ----------------
  function chiamaApi_(azione, dati) {
    var corpo = Object.assign({ azione: azione, token: TOKEN_ }, dati || {});
    return fetch(URL_APPS_SCRIPT_, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(corpo)
    })
      .then(function (r) { return r.json(); })
      .then(function (risposta) {
        if (!risposta.ok) throw new Error(risposta.errore || 'Errore sconosciuto');
        return risposta.dati;
      });
  }

  // ---------------- TOAST ----------------
  var timerToast_ = null;
  function mostraToast_(testo) {
    var box = document.getElementById('toast');
    box.textContent = testo;
    box.classList.add('visibile');
    clearTimeout(timerToast_);
    timerToast_ = setTimeout(function () { box.classList.remove('visibile'); }, 4000);
  }
  function mostraAttesa_(testo) {
    document.getElementById('testoAttesa').textContent = testo || 'Attendere...';
    document.getElementById('overlayAttesa').style.display = 'flex';
  }
  function nascondiAttesa_() {
    document.getElementById('overlayAttesa').style.display = 'none';
  }
  function mostraSchermo_(id) {
    ['schermoCamera', 'schermoPermesso', 'schermoRevisione'].forEach(function (nome) {
      document.getElementById(nome).style.display = (nome === id) ? (nome === 'schermoCamera' ? 'flex' : 'flex') : 'none';
    });
  }

  // ---------------- STATO SLOT (5 posizioni fisse) ----------------
  // ordine: 1 targa, 2 scudettoPost, 3 campoLargo, 4 campoLargo, 5 scudettoAnt
  var CONFIG_SLOT_ = [
    { indice: 1, tipoCasa: 'targa', etichetta: 'Targa' },
    { indice: 2, tipoCasa: 'scudettoPost', etichetta: 'Scudetto post.' },
    { indice: 3, tipoCasa: 'campoLargo', etichetta: 'Campo largo' },
    { indice: 4, tipoCasa: 'campoLargo', etichetta: 'Campo largo' },
    { indice: 5, tipoCasa: 'scudettoAnt', etichetta: 'Scudetto ant.' }
  ];
  var slotFoto_ = [null, null, null, null, null]; // ognuno: null oppure { tipo, blobUrl, idFileTemp, caricamentoInCorso }

  function trovaSlotPerTipo_(tipo) {
    for (var i = 0; i < CONFIG_SLOT_.length; i++) {
      if (CONFIG_SLOT_[i].tipoCasa === tipo && !slotFoto_[i]) return i;
    }
    for (var j = CONFIG_SLOT_.length - 1; j >= 0; j--) {
      if (!slotFoto_[j]) return j;
    }
    return -1;
  }

  function contaFotoScattate_() {
    return slotFoto_.filter(Boolean).length;
  }

  function aggiornaContatore_() {
    document.getElementById('contatoreFoto').textContent = contaFotoScattate_() + ' di 5';
  }

  function renderizzaStrisciaSlot_() {
    var striscia = document.getElementById('strisciaSlot');
    striscia.innerHTML = '';
    CONFIG_SLOT_.forEach(function (cfg, i) {
      var div = document.createElement('div');
      div.className = 'slot' + (slotFoto_[i] ? ' pieno' : '');
      if (slotFoto_[i]) {
        var img = document.createElement('img');
        img.src = slotFoto_[i].blobUrl;
        div.appendChild(img);
      } else {
        var span = document.createElement('span');
        span.textContent = cfg.etichetta;
        div.appendChild(span);
      }
      striscia.appendChild(div);
    });
    aggiornaContatore_();
  }

  // ---------------- ZOOM DIGITALE ----------------
  var ZOOM_MIN_ = 1;
  var ZOOM_MAX_ = 4;
  var livelloZoom_ = 1;

  function applicaZoomVisivo_() {
    document.getElementById('video').style.transform = 'scale(' + livelloZoom_ + ')';
    document.getElementById('zoomValore').textContent = livelloZoom_.toFixed(1) + 'x';
  }

  function modificaZoom_(delta) {
    livelloZoom_ = Math.min(ZOOM_MAX_, Math.max(ZOOM_MIN_, +(livelloZoom_ + delta).toFixed(2)));
    applicaZoomVisivo_();
  }

  function azzeraZoom_() {
    livelloZoom_ = 1;
    applicaZoomVisivo_();
  }

  // Pizzico a due dita sull'area video.
  (function () {
    var areaVideo = document.getElementById('areaVideo');
    var distanzaIniziale_ = null;
    var zoomIniziale_ = 1;

    areaVideo.addEventListener('touchstart', function (e) {
      if (e.touches.length === 2) {
        var dx = e.touches[0].clientX - e.touches[1].clientX;
        var dy = e.touches[0].clientY - e.touches[1].clientY;
        distanzaIniziale_ = Math.sqrt(dx * dx + dy * dy);
        zoomIniziale_ = livelloZoom_;
      }
    }, { passive: true });

    areaVideo.addEventListener('touchmove', function (e) {
      if (e.touches.length === 2 && distanzaIniziale_) {
        e.preventDefault();
        var dx = e.touches[0].clientX - e.touches[1].clientX;
        var dy = e.touches[0].clientY - e.touches[1].clientY;
        var nuovaDistanza = Math.sqrt(dx * dx + dy * dy);
        var fattore = nuovaDistanza / distanzaIniziale_;
        livelloZoom_ = Math.min(ZOOM_MAX_, Math.max(ZOOM_MIN_, +(zoomIniziale_ * fattore).toFixed(2)));
        applicaZoomVisivo_();
      }
    }, { passive: false });

    areaVideo.addEventListener('touchend', function (e) {
      if (e.touches.length < 2) distanzaIniziale_ = null;
    });
  })();

  // ---------------- SELEZIONE OVERLAY GUIDA ----------------
  var tipoOverlayCorrente_ = 'targa';
  var GUIDE_ = {
    targa:        { forma: 'rett', larghezza: '55%', altezza: '16%', tondo: false, testo: 'Inquadra la targa' },
    scudettoPost: { forma: 'rett', larghezza: '85%', altezza: '75%', tondo: false, testo: 'Inquadra lo scudetto, il più vicino possibile' },
    campoLargo:   { forma: 'rett', larghezza: '45%', altezza: '28%', tondo: false, testo: "Inquadra tutta l'auto" },
    scudettoAnt:  { forma: 'rett', larghezza: '65%', altezza: '65%', tondo: true,  testo: 'Inquadra lo scudetto anteriore' }
  };

  function selezionaOverlay_(tipo) {
    tipoOverlayCorrente_ = tipo;
    document.querySelectorAll('.icona-overlay').forEach(function (btn) {
      btn.classList.toggle('attivo', btn.getAttribute('data-tipo') === tipo);
    });
    azzeraZoom_(); // cambio overlay -> zoom torna a 1x, come deciso
    disegnaGuidaCorrente_();
  }

  function disegnaGuidaCorrente_() {
    var guida = document.getElementById('guidaOverlay');
    var etichetta = document.getElementById('etichettaGuida');
    var config = GUIDE_[tipoOverlayCorrente_];
    guida.style.width = config.larghezza;
    guida.style.height = config.altezza;
    guida.classList.toggle('tondo', !!config.tondo);
    etichetta.textContent = config.testo;
    aggiornaGuidaVisibile_();
  }
  function aggiornaGuidaVisibile_() {
    var visibile = document.getElementById('toggleOverlay').checked;
    document.getElementById('guidaOverlay').style.display = visibile ? 'block' : 'none';
    document.getElementById('etichettaGuida').style.display = visibile ? 'block' : 'none';
  }

  // ---------------- GEOLOCALIZZAZIONE + INDIRIZZO ----------------
  var indirizzoCorrente_ = null; // { lat, lng, riga1, riga2 } — riga1/riga2 vuote se solo coordinate
  var TIMEOUT_GEOCODING_MS_ = 10000;

  function apriApp_() {
    mostraSchermo_('schermoCamera');
    richiediPosizione_();
  }

  function richiediPosizione_() {
    mostraAttesa_('Ricerca posizione in corso...');
    if (!navigator.geolocation) {
      nascondiAttesa_();
      mostraSchermoPermesso_();
      return;
    }
    navigator.geolocation.getCurrentPosition(function (posizione) {
      risolviIndirizzo_(posizione.coords.latitude, posizione.coords.longitude);
    }, function () {
      nascondiAttesa_();
      mostraSchermoPermesso_();
    }, { enableHighAccuracy: true, timeout: 15000 });
  }

  function risolviIndirizzo_(lat, lng) {
    mostraAttesa_('Individuazione indirizzo...');
    var scaduto = false;
    var timer = setTimeout(function () {
      scaduto = true;
      nascondiAttesa_();
      indirizzoCorrente_ = { lat: lat, lng: lng, riga1: '', riga2: '' };
      avviaVideo_();
    }, TIMEOUT_GEOCODING_MS_);

    chiamaApi_('indirizzoDaCoordinate', { lat: lat, lng: lng })
      .then(function (indirizzo) {
        if (scaduto) return;
        clearTimeout(timer);
        nascondiAttesa_();
        indirizzoCorrente_ = {
          lat: lat, lng: lng,
          riga1: (indirizzo && indirizzo.riga1) || '',
          riga2: (indirizzo && indirizzo.riga2) || ''
        };
        avviaVideo_();
      })
      .catch(function () {
        if (scaduto) return;
        clearTimeout(timer);
        nascondiAttesa_();
        indirizzoCorrente_ = { lat: lat, lng: lng, riga1: '', riga2: '' };
        avviaVideo_();
      });
  }

  function continuaSenzaPosizione_() {
    indirizzoCorrente_ = null;
    mostraSchermo_('schermoCamera');
    avviaVideo_();
  }

  // ---------------- SCHERMATA PERMESSO NEGATO (istruzioni per dispositivo) ----------------
  function rilevaDispositivo_() {
    var ua = navigator.userAgent || '';
    if (/iPhone|iPad|iPod/.test(ua)) return 'ios';
    if (/Android/.test(ua)) return 'android';
    return 'altro';
  }
  function mostraSchermoPermesso_() {
    var dispositivo = rilevaDispositivo_();
    var blocco = document.getElementById('blocIstruzioni');
    if (dispositivo === 'ios') {
      blocco.innerHTML = '<p class="titolo">iPhone — Safari</p>' +
        '<ol><li>Apri Impostazioni &rarr; Safari</li><li>Posizione &rarr; Consenti</li>' +
        '<li>Se il problema persiste: Impostazioni &rarr; Privacy e sicurezza &rarr; Localizzazione &rarr; verifica che sia attiva</li></ol>';
    } else if (dispositivo === 'android') {
      blocco.innerHTML = '<p class="titolo">Android — Chrome</p>' +
        '<ol><li>Apri Impostazioni del telefono</li><li>App &rarr; Chrome (o il browser che usi) &rarr; Autorizzazioni</li>' +
        '<li>Posizione &rarr; Consenti</li></ol>';
    } else {
      blocco.innerHTML = '<p class="titolo">Il tuo browser</p>' +
        '<ol><li>Apri le impostazioni del browser</li><li>Cerca i permessi del sito</li><li>Attiva la Posizione e ricarica la pagina</li></ol>';
    }
    mostraSchermo_('schermoPermesso');
  }

  // ---------------- VIDEO ----------------
  var streamVideo_ = null;

  function avviaVideo_() {
    document.getElementById('bottoneScatta').disabled = true;
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
      .then(function (stream) {
        streamVideo_ = stream;
        var video = document.getElementById('video');
        video.muted = true;
        video.srcObject = stream;

        function provaAvvio_() {
          video.play().catch(function () { /* alcuni browser rifiutano play() senza interazione: non bloccante */ });
        }
        video.onloadedmetadata = provaAvvio_;
        video.oncanplay = provaAvvio_;

        var tentativi = 0;
        var timerControllo = setInterval(function () {
          tentativi++;
          if (video.videoWidth > 0 && video.videoHeight > 0) {
            clearInterval(timerControllo);
            document.getElementById('bottoneScatta').disabled = false;
          } else if (tentativi > 100) {
            clearInterval(timerControllo);
            mostraToast_('La fotocamera non risponde: prova a ricaricare la pagina.');
          }
        }, 100);

        azzeraZoom_();
        disegnaGuidaCorrente_();
      })
      .catch(function () {
        mostraToast_('Impossibile accedere alla fotocamera del dispositivo.');
      });
  }

  // ---------------- FORMATTAZIONE BANDA ----------------
  function formattaDataOraBanda_(data) {
    var g = ('0' + data.getDate()).slice(-2);
    var m = ('0' + (data.getMonth() + 1)).slice(-2);
    var a = data.getFullYear();
    var ore = ('0' + data.getHours()).slice(-2);
    var minuti = ('0' + data.getMinutes()).slice(-2);
    var secondi = ('0' + data.getSeconds()).slice(-2);
    return g + '.' + m + '.' + a + ' - ' + ore + ':' + minuti + ':' + secondi;
  }

  function righeBanda_(dataScatto) {
    var righe = [formattaDataOraBanda_(dataScatto)];
    if (indirizzoCorrente_) {
      if (indirizzoCorrente_.riga1) {
        righe.push(indirizzoCorrente_.riga1);
        if (indirizzoCorrente_.riga2) righe.push(indirizzoCorrente_.riga2);
      } else {
        righe.push(indirizzoCorrente_.lat.toFixed(5) + ', ' + indirizzoCorrente_.lng.toFixed(5));
      }
    }
    return righe;
  }

  function disegnaBanda_(ctx, larghezza, altezza, righe) {
    var dimensioneFont = Math.max(16, Math.round(larghezza * 0.022));
    var interlinea = dimensioneFont * 1.4;
    var paddingLaterale = larghezza * 0.03;
    var paddingVerticale = dimensioneFont * 0.6;

    ctx.font = '600 ' + dimensioneFont + 'px Arial, sans-serif';
    var larghezzaMassima = 0;
    righe.forEach(function (r) { larghezzaMassima = Math.max(larghezzaMassima, ctx.measureText(r).width); });

    var larghezzaRiquadro = larghezzaMassima + paddingLaterale * 2;
    var altezzaRiquadro = righe.length * interlinea + paddingVerticale * 2;
    var x0 = larghezza - larghezzaRiquadro - larghezza * 0.02;
    var y0 = altezza - altezzaRiquadro - altezza * 0.02;

    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(x0, y0, larghezzaRiquadro, altezzaRiquadro);

    ctx.fillStyle = '#FFFFFF';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'top';
    righe.forEach(function (r, i) {
      ctx.fillText(r, larghezza - larghezza * 0.02 - paddingLaterale, y0 + paddingVerticale + i * interlinea);
    });
  }

  // ---------------- EXIF (GPS + indirizzo) ----------------
  function inGradiMinutiSecondi_(valore) {
    var assoluto = Math.abs(valore);
    var gradi = Math.floor(assoluto);
    var minutiFloat = (assoluto - gradi) * 60;
    var minuti = Math.floor(minutiFloat);
    var secondi = Math.round((minutiFloat - minuti) * 60 * 100);
    return [[gradi, 1], [minuti, 1], [secondi, 100]];
  }

  function scriviExif_(dataUrl, dataScatto) {
    if (!indirizzoCorrente_) return dataUrl;
    try {
      var GPS = piexif.GPSIFD;
      var gpsData = {};
      gpsData[GPS.GPSLatitudeRef] = indirizzoCorrente_.lat >= 0 ? 'N' : 'S';
      gpsData[GPS.GPSLatitude] = inGradiMinutiSecondi_(indirizzoCorrente_.lat);
      gpsData[GPS.GPSLongitudeRef] = indirizzoCorrente_.lng >= 0 ? 'E' : 'W';
      gpsData[GPS.GPSLongitude] = inGradiMinutiSecondi_(indirizzoCorrente_.lng);

      var indirizzoTesto = [indirizzoCorrente_.riga1, indirizzoCorrente_.riga2].filter(Boolean).join(', ');
      var exifObj = { 'GPS': gpsData };
      if (indirizzoTesto) {
        exifObj['0th'] = {};
        exifObj['0th'][piexif.ImageIFD.ImageDescription] = indirizzoTesto;
      }
      var exifBytes = piexif.dump(exifObj);
      return piexif.insert(exifBytes, dataUrl);
    } catch (e) {
      return dataUrl;
    }
  }

  // ---------------- SCATTO ----------------
  function scattaFoto_() {
    var indiceSlot = trovaSlotPerTipo_(tipoOverlayCorrente_);
    if (indiceSlot === -1) {
      mostraToast_('Hai già raggiunto il massimo di 5 foto.');
      return;
    }

    var video = document.getElementById('video');
    if (!video.videoWidth || !video.videoHeight) {
      mostraToast_('Fotocamera non ancora pronta: attendi un istante e riprova.');
      return;
    }

    // Ritaglio zoom: dal fotogramma reale prendiamo solo la porzione
    // centrale corrispondente al livello di zoom visivo applicato, così
    // la foto scattata corrisponde a quello che si vedeva ingrandito.
    var larghezzaRitaglio = video.videoWidth / livelloZoom_;
    var altezzaRitaglio = video.videoHeight / livelloZoom_;
    var origineX = (video.videoWidth - larghezzaRitaglio) / 2;
    var origineY = (video.videoHeight - altezzaRitaglio) / 2;

    var canvas = document.getElementById('canvasScatto');
    canvas.width = larghezzaRitaglio;
    canvas.height = altezzaRitaglio;
    var ctx = canvas.getContext('2d');
    ctx.drawImage(
      video,
      origineX, origineY, larghezzaRitaglio, altezzaRitaglio,
      0, 0, larghezzaRitaglio, altezzaRitaglio
    );

    var adesso = new Date();
    disegnaBanda_(ctx, canvas.width, canvas.height, righeBanda_(adesso));

    var mimeType = 'image/jpeg';
    var dataUrl = canvas.toDataURL(mimeType, 0.9);
    dataUrl = scriviExif_(dataUrl, adesso);
    var base64 = dataUrl.split(',')[1];

    var luogoTesto = indirizzoCorrente_
      ? [indirizzoCorrente_.riga1, indirizzoCorrente_.riga2].filter(Boolean).join(', ') || null
      : null;

    slotFoto_[indiceSlot] = {
      tipo: tipoOverlayCorrente_,
      blobUrl: dataUrl,
      idFileTemp: null,
      caricamentoInCorso: true,
      nome: 'scatto_' + adesso.getTime() + '.jpg',
      dataScatto: adesso.toISOString(),
      luogoTesto: luogoTesto
    };
    renderizzaStrisciaSlot_();
    mostraToast_('Foto scattata, caricamento in corso...');

    chiamaApi_('caricaFotoTemp', {
      idSessione: ID_SESSIONE_, base64: base64, mimeType: mimeType,
      nome: slotFoto_[indiceSlot].nome, dataScatto: slotFoto_[indiceSlot].dataScatto, luogoTesto: luogoTesto
    }).then(function (risultato) {
      if (slotFoto_[indiceSlot]) {
        slotFoto_[indiceSlot].idFileTemp = risultato.idFile;
        slotFoto_[indiceSlot].caricamentoInCorso = false;
      }
    }).catch(function (errore) {
      mostraToast_('Errore caricamento foto: ' + errore.message);
    });
  }

  function chiudiSenzaSalvare_() {
    if (streamVideo_) streamVideo_.getTracks().forEach(function (t) { t.stop(); });
    window.location.href = URL_RITORNO_;
  }

  // ---------------- REVISIONE ----------------
  function vaiARevisione_() {
    if (contaFotoScattate_() === 0) {
      mostraToast_('Scatta almeno 1 foto prima di continuare.');
      return;
    }
    if (streamVideo_) streamVideo_.getTracks().forEach(function (t) { t.stop(); });
    renderizzaRevisione_();
    mostraSchermo_('schermoRevisione');
  }

  function tornaAlMirino_() {
    mostraSchermo_('schermoCamera');
    avviaVideo_();
  }

  function renderizzaRevisione_() {
    document.getElementById('testoContatoreRevisione').textContent =
      contaFotoScattate_() + ' di 5 foto scattate.';
    var griglia = document.getElementById('grigliaRevisione');
    griglia.innerHTML = '';
    CONFIG_SLOT_.forEach(function (cfg, i) {
      var cella = document.createElement('div');
      cella.className = 'cella-revisione' + (slotFoto_[i] ? '' : ' vuota');
      if (slotFoto_[i]) {
        var img = document.createElement('img');
        img.src = slotFoto_[i].blobUrl;
        cella.appendChild(img);
        var etichetta = document.createElement('div');
        etichetta.className = 'etichetta-tipo';
        etichetta.textContent = cfg.etichetta;
        cella.appendChild(etichetta);
        var btnX = document.createElement('button');
        btnX.className = 'btn-rimuovi-cella';
        btnX.textContent = '✕';
        btnX.onclick = (function (indice) {
          return function () {
            slotFoto_[indice] = null;
            renderizzaRevisione_();
            renderizzaStrisciaSlot_();
          };
        })(i);
        cella.appendChild(btnX);
      } else {
        var span = document.createElement('span');
        span.className = 'etichetta-tipo';
        span.textContent = cfg.etichetta;
        cella.appendChild(span);
      }
      griglia.appendChild(cella);
    });
  }

  function confermaEInvia_() {
    var inCaricamento = slotFoto_.some(function (f) { return f && f.caricamentoInCorso; });
    if (inCaricamento) {
      mostraToast_('Attendi il completamento del caricamento delle foto...');
      setTimeout(confermaEInvia_, 1500);
      return;
    }
    var falliti = slotFoto_.some(function (f) { return f && !f.idFileTemp; });
    if (falliti) {
      mostraToast_('Alcune foto non sono state caricate correttamente: riprovo...');
    }
    window.location.href = URL_RITORNO_;
  }

  // ---------------- AVVIO ----------------
  apriApp_();
</script>
</body>
</html>
